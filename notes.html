  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #fff;
      color: #111;
      font-family: Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* -- header -- */
    .notes-header {
      padding: 3rem 2rem 2rem;
      max-width: 900px;
      margin: 0 auto;
    }

    .back-link {
      font-size: 0.75rem;
      color: #999;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: color 0.2s;
    }

    .back-link:hover { color: #111; }

    .notes-header h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      text-transform: uppercase;
      margin-top: 1.5rem;
      line-height: 1.1;
      font-weight: 700;
    }

    .notes-header .subtitle {
      font-size: 1rem;
      color: #999;
      margin-top: 0.75rem;
      max-width: 500px;
      line-height: 1.6;
    }

    /* -- grid -- */
    .notes-grid {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 2rem;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      grid-auto-flow: dense;
    }

    @media (max-width: 800px) {
      .notes-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 500px) {
      .notes-grid { grid-template-columns: 1fr; }
    }

    /* -- note card -- */
    .note {
      padding: 1.5rem;
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 4px;
    }

    .note.wide {
      grid-column: span 2;
    }

    @media (max-width: 500px) {
      .note.wide { grid-column: span 1; }
    }

    .note-date {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #bbb;
      margin-bottom: 0.75rem;
    }

    .note-tag {
      display: inline-block;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 2px 8px;
      border-radius: 20px;
      margin-bottom: 0.75rem;
      margin-right: 4px;
    }

    .tag-collect { background: #f0f0f0; color: #888; }
    .tag-display { background: #f0f0f0; color: #888; }
    .tag-fill { background: #f0f0f0; color: #888; }

    .note h2 {
      font-size: 1rem;
      margin-bottom: 0.75rem;
      line-height: 1.4;
      font-weight: 600;
    }

    .note p {
      font-size: 0.95rem;
      line-height: 1.7;
      color: #666;
      margin-bottom: 0.75rem;
    }

    .note p:last-child { margin-bottom: 0; }

    .note img {
      width: 100%;
      border-radius: 2px;
      margin-bottom: 0.75rem;
    }

    .note video {
      width: 100%;
      border-radius: 2px;
      margin-bottom: 0.75rem;
    }

    .note .video-embed {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 2px;
    }

    .note .video-embed iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* -- footer -- */
    footer {
      padding: 3rem 2rem;
      text-align: center;
      font-size: 0.75rem;
      color: #bbb;
    }

    footer a { color: #999; }
  </style>
</head>
